<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aura</title>
    <meta name="description" content="Ambulance dispatch console for Madurai, India." />
    <meta property="og:title" content="aura" />
    <meta property="og:description" content="Ambulance dispatch console for Madurai, India." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600..800;1,9..144,600..800&family=Geist+Mono:wght@400;500;600;700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Noto+Color+Emoji&display=swap">
  </head>
  <body>
    <div id="root">
      <div class="boot-state" role="status" aria-live="polite">
        <span class="boot-wordmark">aura</span>
        <span class="boot-status"><span class="boot-pulse" aria-hidden="true"></span> Connecting to dispatch data</span>
      </div>
    </div>
    <style>
      .boot-state { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f2ebdd; color: #15201c; font-family: "Hanken Grotesk", "Trebuchet MS", sans-serif; }
      .boot-wordmark { font-family: Fraunces, Georgia, serif; font-size: 40px; font-style: italic; }
      .boot-status { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 2px solid #15201c; background: #fffdf7; box-shadow: 3px 3px 0 #15201c; font: 700 11px "Geist Mono", Consolas, monospace; text-transform: uppercase; }
      .boot-pulse { width: 9px; height: 9px; border: 1px solid #15201c; border-radius: 50%; background: #0f8b8d; animation: boot-pulse 1.1s ease-in-out infinite alternate; }
      @keyframes boot-pulse { to { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .boot-pulse { animation: none; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
